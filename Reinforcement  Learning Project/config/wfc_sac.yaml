behaviors:
  Grid_Tile_Agent:

    trainer_type: sac

    hyperparameters:
      learning_rate: 1.0e-4
      learning_rate_schedule: constant

      batch_size: 128
      buffer_size: 100000
      buffer_init_steps: 5000

      tau: 0.005
      steps_per_update: 1.0
      init_entcoef: 0.2

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 150000
    time_horizon: 64
    summary_freq: 5000